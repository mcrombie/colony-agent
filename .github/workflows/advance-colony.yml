name: Advance Colony

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:
    inputs:
      email_only:
        description: Send the latest saved report without advancing the colony
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['.github/workflows/advance-colony.yml']

permissions:
  contents: write

concurrency:
  group: advance-colony
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COLONY_AI_MODE: ${{ vars.COLONY_AI_MODE || 'off' }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the current default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional OpenAI client only when enabled
        if: env.COLONY_AI_MODE == 'daily' || env.COLONY_AI_MODE == 'weekly'
        continue-on-error: true
        run: python -m pip install '.[ai]'
      - name: Advance one UTC day and refresh the atlas
        if: inputs.email_only != true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python -m src.run_day
      - name: Commit the world and atlas together
        if: inputs.email_only != true
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/state.json src/history.md src/people_history.md docs/index.html docs/colony.svg
          if git diff --cached --quiet; then
            echo "Already advanced today; no changes to commit."
            exit 0
          fi
          git commit -m "Advance Blergen frontier [skip ci]"
          for attempt in 1 2 3; do
            if ! git pull --rebase origin "$DEFAULT_BRANCH"; then
              git rebase --abort || true
              echo "Concurrent changes conflict with this day; remote remains intact. Rerun the workflow."
              exit 1
            fi
            if git push origin "HEAD:$DEFAULT_BRANCH"; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
      - name: Send the daily email report
        id: email
        if: vars.COLONY_EMAIL_ENABLED == 'true' && github.event_name != 'push'
        timeout-minutes: 2
        env:
          COLONY_EMAIL_ENABLED: 'true'
          COLONY_EMAIL_TO: ${{ secrets.COLONY_EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          COLONY_DASHBOARD_URL: ${{ vars.COLONY_DASHBOARD_URL }}
          COLONY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -m src.email_delivery

      - name: Commit the email receipt
        if: steps.email.outcome == 'success'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/email_delivery.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record daily email delivery [skip ci]"
          for attempt in 1 2 3; do
            if ! git pull --rebase origin "$DEFAULT_BRANCH"; then
              git rebase --abort || true
              echo "Email was accepted, but receipt conflicted. Check the inbox before retrying."
              exit 1
            fi
            if git push origin "HEAD:$DEFAULT_BRANCH"; then exit 0; fi
            sleep "$attempt"
          done
          echo "Email was accepted, but receipt push failed. Check the inbox before retrying."
          exit 1

      - name: Save a downloadable offline atlas
        uses: actions/upload-artifact@v4
        with:
          name: blergen-atlas
          path: docs/
          retention-days: 7
      - name: Write the run summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          s = json.loads(Path("src/state.json").read_text())
          print(f"### Blergen · completed day {s['day'] - 1}")
          print(f"UTC date: {s['last_run_date']} · Citizens: {s['population']} · Food: {s['food']}")
          print(s['frontier']['last_report'].get('summary', ''))
          print("Default director uses no paid API. Download **blergen-atlas** and open index.html to explore.")
          PY
